<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Comic Book Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Tulika: Origin Story</h1>
    <div id="comic-panels" class="comic-panels"></div>
    <div id="loader" class="loader hidden">
      <div class="loader-bubble">AI is thinking<span class="dots"></span></div>
      <div class="comic-effect">POW!</div>
    </div>
    <form id="question-form" class="question-form hidden">
      <label for="user-question">Ask a question to generate new comic panels:</label>
      <input type="text" id="user-question" required placeholder="e.g. What are your biggest challenges?"/>
      <button type="submit">Regenerate</button>
    </form>
    <div id="error-message" class="error-message hidden"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
