<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My List</title>
  <link rel="stylesheet" href="./public/styles.css">
</head>
<body>
  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">My List</div>
  </header>

  <!-- Chat is the main view -->
  <main class="chat-page">
    <div class="chat-container">
      <!-- <div class="chat-header">
        <h3>Ask about my recommendations</h3>
        <p style="color:#a1a1aa;font-size:14px;margin-top:5px;">
          Ask me where to go, what to eat, or any questions about my recommendations.
        </p>
      </div> -->

      <div id="chat-messages" class="chat-messages">
        <div class="message assistant">
          <div class="message-avatar">AI</div>
          <div class="message-content">
            Hi! I can help you find recommendations from this curated list. Try “Where should I go for dinner?” or “Good bar for cocktails?”
          </div>
        </div>
      </div>

      <div class="chat-input-container">
        <div class="chat-input-wrapper">
          <!-- Left button: open list -->
          <button id="open-list" class="icon-btn" title="Open my restaurant list" aria-label="Open my restaurant list">🍽</button>

          <!-- Plus button: open add modal -->
          <button id="open-add" class="icon-btn" title="Add a place" aria-label="Add a place">＋</button>

          <!-- Text area -->
          <textarea id="chat-input" class="chat-input" placeholder="Ask me for recommendations..." rows="1"></textarea>


          <!-- Send -->
          <button id="chat-send" class="chat-send-btn">Send</button>
        </div>
      </div>
    </div>
  </main>

  <!-- LIST MODAL -->
  <div id="list-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="list"></div>
    <div class="modal-dialog">
      <div class="modal-head">
        <h3>My List <span id="rec-count" class="count-badge">0</span></h3>
        <button class="modal-close" data-close="list" aria-label="Close list">&times;</button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="restaurant">Restaurants</button>
        <button class="filter-btn" data-filter="bar">Bars</button>
        <button class="filter-btn" data-filter="night_club">Clubs</button>
        <button class="filter-btn" data-filter="cafe">Cafes</button>
      </div>

      <div id="recommendations-container" class="recommendations-grid"></div>

      <div id="empty-state" class="empty-state">
        <h3>No recommendations yet</h3>
        <p>Start by adding your favorite places!</p>
      </div>
    </div>
  </div>

  <!-- ADD MODAL -->
  <div id="add-modal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close="add"></div>
    <div class="modal-dialog">
      <div class="modal-head">
        <h3>Add New Place</h3>
        <button class="modal-close" data-close="add" aria-label="Close add">&times;</button>
      </div>

      <div class="add-form" style="margin:0;">
        <div class="form-group">
          <label for="place-search">Search for a place</label>
          <input type="text" id="place-search" class="form-control" placeholder="Start typing restaurant name..." required>
          <div id="search-results" class="search-results"></div>
        </div>

        <div id="selected-place" class="selected-place">
          <h4 style="margin-bottom:10px;">Selected Place:</h4>
          <div id="place-preview"></div>
        </div>

        <form id="add-form" style="display:none;">
          <div class="form-group">
            <label for="comments">Your Comments & Recommendations</label>
            <textarea id="comments" class="form-control" rows="4" placeholder="Dish tips, why you love it, best time to visit..."></textarea>
          </div>
          <button type="submit" class="btn" style="width:100%;">Add to My List</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    /* ---------- API base rewrite (Render on GitHub Pages) ---------- */
    (function(){
      const RENDER_API = 'https://tulikajain-github-io.onrender.com';
      const base = RENDER_API.replace(/\/$/,'');
      const origFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        try {
          let url = typeof input === 'string' ? input : (input && input.url) || '';
          if (typeof url === 'string' && url.startsWith('/api/')) {
            const absolute = base + url;
            if (input instanceof Request) {
              const reqInit = {
                method: input.method, headers: input.headers, body: input.body,
                mode: input.mode, credentials: input.credentials, cache: input.cache,
                redirect: input.redirect, referrer: input.referrer, referrerPolicy: input.referrerPolicy,
                integrity: input.integrity, keepalive: input.keepalive, signal: input.signal
              };
              return origFetch(new Request(absolute, reqInit), init);
            }
            return origFetch(absolute, init);
          }
        } catch(e){ console.warn('fetch rewrite error', e); }
        return origFetch(input, init);
      };
    })();

    /* ---------- State ---------- */
    let recommendations = [];
    let currentFilter = 'all';
    let selectedPlace = null;

    /* ---------- On load ---------- */
    document.addEventListener('DOMContentLoaded', () => {
      loadRecommendations();
    });

    /* ---------- Modal helpers ---------- */
    const listModal = document.getElementById('list-modal');
    const addModal  = document.getElementById('add-modal');

    function openModal(which) {
      const m = which === 'list' ? listModal : addModal;
      m.setAttribute('aria-hidden','false');
      m.classList.add('open');
      // focus first input if add
      if (which === 'add') setTimeout(() => document.getElementById('place-search')?.focus(), 50);
    }
    function closeModal(which) {
      const m = which === 'list' ? listModal : addModal;
      m.classList.remove('open');
      m.setAttribute('aria-hidden','true');
    }

    document.getElementById('open-list').addEventListener('click', () => {
      renderRecommendations();
      openModal('list');
    });
    document.getElementById('open-add').addEventListener('click', () => openModal('add'));

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.addEventListener('click', (e) => closeModal(e.currentTarget.dataset.close));
    });

    /* Close on Esc */
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (addModal.classList.contains('open')) closeModal('add');
        if (listModal.classList.contains('open')) closeModal('list');
      }
    });

    /* ---------- LIST: load & render ---------- */
    async function loadRecommendations() {
      try {
        const res = await fetch('/api/recommendations');
        recommendations = await res.json();
        updateRecCount();
      } catch (err) {
        console.error('Error loading recommendations:', err);
      }
    }
    function updateRecCount() {
      const el = document.getElementById('rec-count');
      if (el) el.textContent = recommendations.length;
    }

    function renderRecommendations() {
      const container = document.getElementById('recommendations-container');
      const emptyState = document.getElementById('empty-state');
      const filtered = currentFilter === 'all' ? recommendations : recommendations.filter(r => r.category === currentFilter);

      if (!filtered.length) {
        container.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }
      container.style.display = 'grid';
      emptyState.style.display = 'none';
      container.innerHTML = filtered.map(rec => `
        <div class="rec-card">
          <div class="rec-header">
            <div>
              <div class="rec-title">${rec.name}</div>
              ${rec.cuisine ? `<div style="color:#a1a1aa;font-size:14px;">${rec.cuisine}</div>` : ''}
              ${rec.rating ? `<div class="rec-rating">⭐ ${rec.rating}</div>` : ''}
            </div>
            <div class="rec-category">${rec.category}</div>
          </div>
          <div class="rec-details">
            <div class="rec-detail"><strong>📍</strong> ${rec.location}</div>
            ${rec.priceRange ? `<div class="rec-detail"><strong>💰</strong> ${rec.priceRange}</div>` : ''}
            ${rec.phone ? `<div class="rec-detail"><strong>📞</strong> ${rec.phone}</div>` : ''}
            ${rec.hours ? `<div class="rec-detail"><strong>🕒</strong> ${rec.hours}</div>` : ''}
            ${rec.website ? `<div class="rec-detail"><strong>🌐</strong> <a href="${rec.website}" target="_blank" style="color:#667eea;">Website</a></div>` : ''}
          </div>
          ${rec.comments ? `<div class="rec-comments">${rec.comments}</div>` : ''}
          <div class="rec-actions">
            <button class="btn-small btn-danger" onclick="deleteRecommendation('${rec.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderRecommendations();
    });

    async function deleteRecommendation(id) {
      if (!confirm('Delete this recommendation?')) return;
      try {
        const res = await fetch(`/api/recommendations/${id}`, { method: 'DELETE' });
        if (res.ok) {
          recommendations = recommendations.filter(r => r.id !== id);
          updateRecCount();
          renderRecommendations();
        } else throw new Error('Failed to delete');
      } catch (err) {
        console.error('Delete error:', err);
        alert('Error deleting recommendation. Please try again.');
      }
    }
    window.deleteRecommendation = deleteRecommendation;

    /* ---------- ADD: search & save ---------- */
    function renderSearchResults(places) {
      const results = document.getElementById('search-results');
      results.innerHTML = places.map(place => {
        const priceLevel = '💰'.repeat(place.price_level || 1);
        const rating = place.rating ? `⭐ ${place.rating}` : '';
        const category = place.types.includes('restaurant') ? 'restaurant' :
                         place.types.includes('bar') ? 'bar' :
                         place.types.includes('night_club') ? 'night_club' :
                         place.types.includes('cafe') ? 'cafe' : 'restaurant';
        return `
          <div class="search-result" onclick="selectPlace('${place.place_id}')">
            <div class="result-name">${place.name}</div>
            <div class="result-address">${place.formatted_address}</div>
            <div class="result-info">
              ${rating} ${priceLevel}
              <span style="text-transform:capitalize;">${category}</span>
              ${place.opening_hours?.open_now ? '<span style="color:#10b981;">Open now</span>' : '<span style="color:#ef4444;">Closed</span>'}
            </div>
          </div>
        `;
      }).join('');
      results.style.display = places.length ? 'block' : 'none';
    }

    document.addEventListener('keydown', async (e) => {
      if (e.target.id !== 'place-search' || e.key !== 'Enter') return;
      e.preventDefault();
      const query = e.target.value.trim();
      document.getElementById('search-results').style.display = 'none';
      if (query.length < 2) return;
      try {
        const res = await fetch(`/api/search-places?query=${encodeURIComponent(query)}`);
        const places = await res.json();
        renderSearchResults(places);
      } catch (err) {
        console.error('Search error:', err);
      }
    });

    async function selectPlace(placeId) {
      try {
        const res = await fetch(`/api/place-details/${placeId}`);
        const details = await res.json();

        selectedPlace = {
          placeId,
          name: details.name,
          address: details.formatted_address,
          phone: details.formatted_phone_number,
          hours: details.opening_hours?.weekday_text?.join(', ') || 'Hours not available',
          priceLevel: details.price_level,
          rating: details.rating,
          website: details.website,
          types: details.types || []
        };

        const category = details.types.includes('restaurant') ? 'restaurant' :
                         details.types.includes('bar') ? 'bar' :
                         details.types.includes('night_club') ? 'night_club' :
                         details.types.includes('cafe') ? 'cafe' : 'restaurant';
        selectedPlace.category = category;

        const cuisineTypes = details.types.filter(t => !['restaurant','bar','night_club','cafe','food','establishment','point_of_interest'].includes(t));
        selectedPlace.cuisine = cuisineTypes.length ? cuisineTypes[0].replace(/_/g,' ') : '';

        document.getElementById('place-preview').innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;">
            <div>
              <h5 style="margin-bottom:5px;">${selectedPlace.name}</h5>
              <div style="font-size:12px;color:#a1a1aa;">${selectedPlace.address}</div>
            </div>
            <div style="text-align:right;font-size:12px;">
              ${selectedPlace.rating ? `⭐ ${selectedPlace.rating}` : ''}
              ${selectedPlace.priceLevel ? `<br>${'💰'.repeat(selectedPlace.priceLevel)}` : ''}
            </div>
          </div>
          <div style="font-size:12px;color:#666;">
            <strong>Category:</strong> ${category}
            ${selectedPlace.cuisine ? ` | <strong>Type:</strong> ${selectedPlace.cuisine}` : ''}
          </div>
        `;
        document.getElementById('selected-place').classList.add('show');
        document.getElementById('add-form').style.display = 'block';
        document.getElementById('search-results').style.display = 'none';
        document.getElementById('place-search').value = selectedPlace.name;
      } catch (err) {
        console.error('Details error:', err);
        alert('Error loading place details. Please try again.');
      }
    }
    window.selectPlace = selectPlace;

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedPlace) return alert('Please select a place first');

      const recommendation = {
        name: selectedPlace.name,
        category: selectedPlace.category,
        cuisine: selectedPlace.cuisine,
        location: selectedPlace.address,
        priceRange: selectedPlace.priceLevel ? '$'.repeat(selectedPlace.priceLevel) : '',
        hours: selectedPlace.hours,
        phone: selectedPlace.phone,
        website: selectedPlace.website,
        rating: selectedPlace.rating,
        comments: document.getElementById('comments').value.trim(),
        placeId: selectedPlace.placeId
      };

      try {
        const res = await fetch('/api/recommendations', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(recommendation)
        });
        if (!res.ok) throw new Error('Failed to add');
        const newRec = await res.json();
        recommendations.push(newRec);
        updateRecCount();

        // reset form
        e.target.reset();
        document.getElementById('place-search').value = '';
        document.getElementById('selected-place').classList.remove('show');
        document.getElementById('add-form').style.display = 'none';
        selectedPlace = null;

        alert('Place added!');
        closeModal('add');
        openModal('list');
        renderRecommendations();
      } catch (err) {
        console.error('Add error:', err);
        alert('Error adding place. Please try again.');
      }
    });

    /* ---------- Chat ---------- */
    const chatMessages = document.getElementById('chat-messages');
    const chatInput    = document.getElementById('chat-input');
    const chatSend     = document.getElementById('chat-send');

    function addMessage(content, isUser=false) {
      const wrap = document.createElement('div');
      wrap.className = `message ${isUser ? 'user' : 'assistant'}`;
      wrap.innerHTML = `
        <div class="message-avatar">${isUser ? 'Me' : 'AI'}</div>
        <div class="message-content">${content}</div>
      `;
      chatMessages.appendChild(wrap);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addLoadingMessage() {
      const d = document.createElement('div');
      d.className = 'message assistant loading-message';
      d.innerHTML = `
        <div class="message-avatar">AI</div>
        <div class="message-content loading">
          <span>Thinking</span>
          <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
          </div>
        </div>`;
      chatMessages.appendChild(d);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return d;
    }

    async function handleChatMessage(message) {
      const loading = addLoadingMessage();
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        loading.remove();
        addMessage(data.response);
      } catch (err) {
        loading.remove();
        addMessage('Sorry, I encountered an error. Please try again.');
        console.error('Chat error:', err);
      }
    }

    function sendMessage() {
      const msg = chatInput.value.trim();
      if (!msg) return;
      addMessage(msg, true);
      chatInput.value = '';
      chatInput.style.height = 'auto';
      handleChatMessage(msg);
    }

    chatSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    chatInput.addEventListener('input', function(){
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });

    /* Hide search results when clicking outside (add modal) */
    document.addEventListener('click', function(e) {
      if (!e.target.closest('#place-search') && !e.target.closest('#search-results')) {
        const el = document.getElementById('search-results');
        if (el) el.style.display = 'none';
      }
    });
  </script>
</body>
</html>
